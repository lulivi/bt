[package]
name = "bt"
version = "0.1.1"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
anyhow = "1.0.105"
axum = { version = "0.8.9", features = ["ws"] }
futures-util = "0.3.34"
rand = "0.10.4"
rust-embed = "8.14.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
subtle = "2.6.1"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "process", "sync", "time", "io-util", "net", "signal"] }
toml = "1.2.3"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
url = "2.5.9"
uuid = { version = "1.29.3", features = ["v4", "serde"] }

[dev-dependencies]
tempfile = "3.27.0"
tokio-tungstenite = "0.30.0"

[lints.clippy]
missing_docs_in_private_items = "warn" # an error in `make check`
